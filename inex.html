<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Shreya Sri!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            text-align: center;
            padding: 40px 30px;
            position: relative;
        }
        
        h1 {
            color: #e84393;
            margin-bottom: 15px;
            font-size: 2.8rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .birthday-girl {
            font-size: 2.2rem;
            color: #6c5ce7;
            margin-bottom: 30px;
            font-weight: 600;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
        }
        
        .birthday-message {
            margin-top: 30px;
            padding: 40px 30px;
            background: linear-gradient(135deg, #fdbb2d, #22c1c3);
            border-radius: 15px;
            color: white;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1.5s ease;
            position: relative;
            overflow: hidden;
        }
        
        .birthday-message::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0) 70%);
            animation: shine 3s infinite;
        }
        
        .birthday-message h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }
        
        .birthday-message p {
            font-size: 1.3rem;
            line-height: 1.6;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
        }
        
        .balloons {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
        }
        
        .balloon {
            position: absolute;
            width: 50px;
            height: 60px;
            border-radius: 50%;
            opacity: 0;
        }
        
        .balloon::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 30px;
            background: rgba(0, 0, 0, 0.2);
        }
        
        .balloon:nth-child(1) { background: #ff7675; left: 10%; animation: float 15s infinite ease-in-out; }
        .balloon:nth-child(2) { background: #74b9ff; left: 20%; animation: float 18s infinite ease-in-out 2s; }
        .balloon:nth-child(3) { background: #55efc4; left: 30%; animation: float 12s infinite ease-in-out 1s; }
        .balloon:nth-child(4) { background: #ffeaa7; left: 40%; animation: float 16s infinite ease-in-out 3s; }
        .balloon:nth-child(5) { background: #a29bfe; left: 50%; animation: float 14s infinite ease-in-out 0.5s; }
        .balloon:nth-child(6) { background: #fd79a8; left: 60%; animation: float 17s infinite ease-in-out 2.5s; }
        .balloon:nth-child(7) { background: #81ecec; left: 70%; animation: float 13s infinite ease-in-out 1.5s; }
        .balloon:nth-child(8) { background: #fab1a0; left: 80%; animation: float 19s infinite ease-in-out 4s; }
        .balloon:nth-child(9) { background: #ffeaa7; left: 90%; animation: float 11s infinite ease-in-out 0.8s; }
        
        @keyframes float {
            0% { bottom: -100px; opacity: 0; transform: translateX(0); }
            10% { opacity: 1; }
            50% { transform: translateX(20px); }
            90% { opacity: 1; }
            100% { bottom: 100%; opacity: 0; transform: translateX(-20px); }
        }
        
        .cake-container {
            margin: 30px auto;
            width: 280px;
            height: 200px;
            position: relative;
        }
        
        .cake {
            width: 250px;
            height: 120px;
            position: absolute;
            bottom: 0;
            left: 15px;
        }
        
        .cake-base {
            width: 250px;
            height: 80px;
            background: #f8c291;
            border-radius: 10px 10px 0 0;
            position: relative;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
        }
        
        .cake-top {
            width: 220px;
            height: 60px;
            background: #e66767;
            border-radius: 10px 10px 0 0;
            position: absolute;
            top: -30px;
            left: 15px;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
        }
        
        .cake-decoration {
            position: absolute;
            width: 100%;
            height: 10px;
            background: #ff9ff3;
            top: 10px;
            border-radius: 5px;
        }
        
        .candle-holder {
            display: flex;
            justify-content: space-around;
            position: absolute;
            bottom: 80px;
            width: 100%;
            padding: 0 20px;
        }
        
        .candle {
            width: 14px;
            height: 50px;
            background: linear-gradient(to right, #ff9f43, #ffaf60, #ff9f43);
            border-radius: 7px 7px 0 0;
            position: relative;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            z-index: 2;
        }
        
        .candle::before {
            content: "";
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 5px;
            background: #d63031;
            border-radius: 0 0 3px 3px;
        }
        
        .candle::after {
            content: "";
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 10px;
            background: #ff9f43;
            border-radius: 50%;
            opacity: 0.7;
        }
        
        .flame {
            width: 18px;
            height: 35px;
            background: linear-gradient(to bottom, #ffff00, #ff9f43, #ff6b6b);
            border-radius: 50% 50% 20% 20%;
            position: absolute;
            top: -40px;
            left: -2px;
            animation: flicker 0.8s infinite alternate;
            box-shadow: 0 0 15px #ff9f43;
            z-index: 3;
        }
        
        .flame::after {
            content: "";
            position: absolute;
            top: 5px;
            left: 5px;
            width: 8px;
            height: 15px;
            background: #ffff00;
            border-radius: 50%;
            opacity: 0.7;
        }
        
        .wax-drip {
            position: absolute;
            width: 5px;
            height: 10px;
            background: #ff9f43;
            border-radius: 0 0 5px 5px;
            opacity: 0.8;
        }
        
        .wax-drip:nth-child(1) { bottom: -5px; left: 2px; }
        .wax-drip:nth-child(2) { bottom: -8px; left: 7px; }
        .wax-drip:nth-child(3) { bottom: -6px; right: 3px; }
        
        @keyframes flicker {
            0% { transform: scale(1) rotate(-1deg); opacity: 0.9; height: 35px; }
            50% { transform: scale(1.05) rotate(0deg); opacity: 1; height: 40px; }
            100% { transform: scale(1.1) rotate(1deg); opacity: 0.95; height: 38px; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes shine {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .confetti {
            position: absolute;
            width: 10px;
            height: 20px;
            opacity: 0;
        }
        
        .message-container {
            position: relative;
            z-index: 2;
        }
        
        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .birthday-girl { font-size: 1.8rem; }
            .birthday-message h2 { font-size: 2rem; }
            .birthday-message p { font-size: 1.1rem; }
            .cake-container { transform: scale(0.8); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Happy Birthday!</h1>
        <div class="birthday-girl">Shreya Sri</div>
        
        <div class="cake-container">
            <div class="cake">
                <div class="cake-base">
                    <div class="cake-decoration"></div>
                </div>
                <div class="cake-top"></div>
                
                <div class="candle-holder">
                    <div class="candle">
                        <div class="flame"></div>
                        <div class="wax-drip"></div>
                        <div class="wax-drip"></div>
                        <div class="wax-drip"></div>
                    </div>
                    <div class="candle">
                        <div class="flame"></div>
                        <div class="wax-drip"></div>
                        <div class="wax-drip"></div>
                        <div class="wax-drip"></div>
                    </div>
                    <div class="candle">
                        <div class="flame"></div>
                        <div class="wax-drip"></div>
                        <div class="wax-drip"></div>
                        <div class="wax-drip"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="message-container">
            <div class="birthday-message">
                <h2>Happy Birthday Shreya Sri!</h2>
                <p>Wishing you a day filled with happiness, joy, and all the things you love most!</p>
                <p>May this year bring you success in all your endeavors and happiness in every moment.</p>
                <p>Have a fantastic celebration and an amazing year ahead!</p>
            </div>
        </div>
        
        <div class="balloons">
            <div class="balloon"></div>
            <div class="balloon"></div>
            <div class="balloon"></div>
            <div class="balloon"></div>
            <div class="balloon"></div>
            <div class="balloon"></div>
            <div class="balloon"></div>
            <div class="balloon"></div>
            <div class="balloon"></div>
        </div>
    </div>

    <script>
        // Create confetti effect
        function createConfetti() {
            const colors = ['#ff7675', '#74b9ff', '#55efc4', '#ffeaa7', '#a29bfe', '#fd79a8'];
            const container = document.querySelector('.container');
            
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.transform = `rotate(${Math.random() * 360}deg)`;
                confetti.style.animation = `float ${2 + Math.random() * 3}s forwards`;
                container.appendChild(confetti);
                
                // Remove confetti after animation
                setTimeout(() => {
                    confetti.remove();
                }, 5000);
            }
        }
        
        // Create confetti when page loads
        window.onload = function() {
            createConfetti();
            
            // Add interactive candle effect
            const candles = document.querySelectorAll('.candle');
            candles.forEach(candle => {
                candle.addEventListener('click', function() {
                    const flame = this.querySelector('.flame');
                    if (flame.style.animationPlayState === 'paused') {
                        flame.style.animationPlayState = 'running';
                        flame.style.display = 'block';
                    } else {
                        flame.style.animationPlayState = 'paused';
                        setTimeout(() => {
                            flame.style.display = 'none';
                        }, 300);
                    }
                });
            });
        };
    </script>
</body>
</html>
